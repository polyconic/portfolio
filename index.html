    <style>
        :root {
            --text-color: #ffffff;
            --overlay-gradient: linear-gradient(

        /* ==================== BACKGROUND ==================== */
        .bg {

            inset: 0;
            z-index: 0;
            background-image: url('BLUR.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #0a0a0a;
        }

        .bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--overlay-gradient);
        }

        /* ==================== LAYOUT ==================== */
        .wrapper {
            position: relative;
            z-index: 1;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 36px 40px;
        }

        /* ==================== TOP ROW ==================== */
        .top-row {
            display: flex;
            justify-content: flex-end;
            align-items: flex-start;
        }

        .utility-nav {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .utility-nav a {
            color: var(--text-color);
            opacity: 1;
            transition: opacity 0.2s ease;
            display: flex;
            align-items: center;
        }

        .utility-nav a:hover {
            opacity: 0.5;
        }

        /* ==================== BOTTOM ROW ==================== */
        .bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .site-name {
            font-size: clamp(28px, 5vw, 72px);
            font-weight: 700;
            letter-spacing: -3px;
            text-transform: uppercase;
            line-height: 0.88;
            color: #fff;
            white-space: nowrap;
        }

        .site-name .slashes {
            position: relative;
            bottom: 5px;
            display: inline-block;
            transform: scaleY(0.8);
        }

        .arrive {
            display: inline-block;
            white-space: pre;
        }

        .arrive-text {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
        }

        .bio {
            position: absolute;
            right: 17vw;
            top: 63%;
            transform: translateY(-80%);
            font-size: 12px;
            line-height: 1.6;
            white-space: nowrap;
        }

        .bio-links {
            list-style: none;
            margin-top: 14px;
        }

        .bio-link {
            color: inherit;
            text-decoration: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
            padding-bottom: 1px;
            transition: opacity 0.2s ease, border-color 0.2s ease;
        }

        .bio-link:hover {
            opacity: 0.5;
        }

        .bio-link:focus-visible {
            outline: 1px solid #fff;
            outline-offset: 3px;
        }

        .scr {
            position: relative;
            display: inline-block;
            white-space: nowrap;
        }

        .scr-real {
            opacity: 0;
        }

        .scr-fx {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0.8;
        }

        /* ==================== RESPONSIVE ==================== */
        @media (max-width: 900px) {
            .wrapper {

            }

                align-items: flex-start;
                gap: 14px;

            .bio {

    <script>
        // The real text stays in .scr-real the whole time; only the decorative overlay is scrambled,
        // so crawlers and screen readers never see a garbled frame.
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*';
        const duration = 2000;

        function scrambleText(real, fx) {
            const finalText = real.textContent;
            const start = performance.now();

            const animate = now => {
                const progress = Math.min((now - start) / duration, 1);
                let output = '';
                for (let i = 0; i < finalText.length; i++) {
                    if (finalText[i] === ' ' || i < finalText.length * progress) {
                        output += finalText[i];
                    } else {
                        output += chars[Math.floor(Math.random() * chars.length)];
                    }
                }
                fx.textContent = output;
                if (progress < 1) requestAnimationFrame(animate);
            };
            requestAnimationFrame(animate);
        }

        const pairs = reduceMotion ? [] : [...document.querySelectorAll('.scr')].map(el => {
            const real = document.createElement('span');
            real.className = 'scr-real';
            real.textContent = el.textContent;
            const fx = document.createElement('span');
            fx.className = 'scr-fx';
            fx.setAttribute('aria-hidden', 'true');
            el.replaceChildren(real, fx);
            return [real, fx];
        });

        function startScramble() {
            pairs.forEach(([real, fx]) => scrambleText(real, fx));
        }
        if (document.prerendering) document.addEventListener('prerenderingchange', startScramble, { once: true });
        else startScramble();
    </script>
