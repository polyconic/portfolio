    <style>
        :root {
            --text-color: #ffffff;
            --overlay-gradient: linear-gradient(
                to bottom,
                rgba(10, 10, 10, 0.25) 0%,
                rgba(10, 10, 10, 0.00) 35%,
                rgba(10, 10, 10, 0.55) 100%

        }

        * {

            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
                Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #0a0a0a;
            color: var(--text-color);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        /* ==================== BACKGROUND ==================== */
        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image: url('BLUR.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #0a0a0a;
        }

        .bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--overlay-gradient);
        }

        /* ==================== LAYOUT ==================== */
        .wrapper {
            position: relative;
            z-index: 1;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 36px 40px;
        }

        /* ==================== TOP ROW ==================== */
        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        nav.main-nav {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        nav.main-nav a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 1;
            transition: opacity 0.2s ease;
            font-weight: 400;
            line-height: 1.4;
        }

        nav.main-nav a:hover {
            opacity: 1;
        }

        .utility-nav {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .utility-nav a {
            color: var(--text-color);
            opacity: 1;
            transition: opacity 0.2s ease;
            display: flex;
            align-items: center;
        }

        .utility-nav a:hover {
            opacity: 1;
        }

        /* ==================== BOTTOM ROW ==================== */
        .bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .site-name {
            font-size: clamp(28px, 5vw, 72px);
            font-weight: 700;
            letter-spacing: -3px;
            text-transform: uppercase;

            color: #fff;
            white-space: nowrap;
        }

        .site-name .slashes {
            position: relative;
            bottom: 5px;
            display: inline-block;
            transform: scaleY(0.8);
        }

        .bio {
            position: absolute;
            right: 450px;
            top: 30%;
            transform: translateY(-80%);
            font-size: 12px;
            line-height: 1.6;
            white-space: nowrap;
        }

        .bio-real {
            opacity: 0;
            position: absolute;
        }

        .bio-scramble {
            opacity: 0.8;
        }

        /* ==================== RESPONSIVE ==================== */
        @media (max-width: 900px) {
            .wrapper {
                padding: 28px 24px;
            }

            .site-name {
                letter-spacing: -2px;
            }

            /* visually hidden rather than display:none, so the bio text
               still counts on Google's mobile-first crawl */
            .bio {
                position: absolute;
                width: 1px;
                height: 1px;
                overflow: hidden;
                clip: rect(0 0 0 0);
                clip-path: inset(50%);
                white-space: nowrap;
                right: auto;
                top: auto;
                transform: none;
            }
        }

        @media (max-width: 600px) {

            nav.main-nav a {

        @media (prefers-reduced-motion: reduce) {

            .bio-scramble { display: none; }
        }

<body>

        <!-- FLOATING BIO -->

            <span class="bio-real">Los Angeles based photographer, graphic designer, and sound artist.</span>
            <span class="bio-scramble" aria-hidden="true"></span>
        </div>

    </div>

    <script>
        // apply saved theme for cross page consistency (toggle is on other pages)
        const currentTheme = localStorage.getItem('theme') || 'light';
        if (currentTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }

        // text scramble on bio - animates a decorative overlay only
        // real sentence lives in .bio-real the whole time, so crawlers
        // and screen readers always see the actual text, never garbled mid-animation frames - Gregor.
        function scrambleText(realEl, scrambleEl) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*';
            const finalText = realEl.textContent;
            const duration = 2000;
            const fps = 60;
            const totalFrames = duration / (1000 / fps);
            let frame = 0;

            const animate = () => {
                let output = '';
                const progress = frame / totalFrames;

                for (let i = 0; i < finalText.length; i++) {
                    if (finalText[i] === ' ') {
                        output += ' ';
                    } else if (i < finalText.length * progress) {
                        output += finalText[i];
                    } else {
                        output += chars[Math.floor(Math.random() * chars.length)];
                    }
                }

                scrambleEl.textContent = output;
                frame++;

                if (frame <= totalFrames) {
                    requestAnimationFrame(animate);
                } else {
                    scrambleEl.textContent = finalText;
                }
            };

            animate();
        }

        const realBio = document.querySelector('.bio-real');
        const scrambleBio = document.querySelector('.bio-scramble');
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (realBio && scrambleBio && !reduceMotion) scrambleText(realBio, scrambleBio);
    </script>
