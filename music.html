    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #0a0a0a;
            --text-color: #f5f5f5;
            --rule-color: rgba(245, 245, 245, 0.18);
            --lightbox-bg: rgba(10, 10, 10, 0.96);
            --placeholder: rgba(245, 245, 245, 0.07);
        }

        [data-theme="light"] {
            --bg-color: #fafaf8;
            --text-color: #141414;
            --rule-color: rgba(20, 20, 20, 0.16);
            --lightbox-bg: rgba(250, 250, 248, 0.97);
            --placeholder: rgba(20, 20, 20, 0.06);
        }

        body {
            overflow-x: clip;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
                Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ==================== HEADER ==================== */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 24px 40px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .theme-toggle {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            gap: 4px;
            color: inherit;
            transition: opacity 0.2s ease;
            line-height: 1;
            position: relative;
            top: 1px;
        }

        .theme-toggle:hover {
            opacity: 0.7;
        }

        .theme-toggle svg {
            width: 18px;
            height: 18px;
        }

        .theme-toggle .slash {
            font-size: 18px;
            font-weight: 300;
        }

        .logo {
            view-transition-name: site-logo;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            text-decoration: none;
            color: inherit;
        }

        .nav-links {
            view-transition-name: site-utils;
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-color);
            text-decoration: none;
            transition: opacity 0.2s ease;
            display: flex;
            align-items: center;
        }

        .nav-links a:hover {
            opacity: 0.5;
        }

        .nav-links svg {
            display: block;
        }

        .section-nav {
            display: flex;
            gap: 20px;
            margin: 2px auto 0 32px;
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .section-nav a {
            color: var(--text-color);
            text-decoration: none;
            opacity: 0.5;
            transition: opacity 0.2s ease;
        }

        .section-nav a:hover,
        .section-nav a[aria-current] {
            opacity: 1;
        }

        /* ==================== MAIN ==================== */
        main {
            flex: 1;
            padding: 40px 40px 80px;
        }

        .back-link {
            display: inline-block;
            color: var(--text-color);
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 20px;
            opacity: 0.7;
            transition: opacity 0.2s ease;
        }

        .back-link:hover {
            opacity: 1;
        }

        .page-title {
            font-size: clamp(48px, 10vw, 120px);
            font-weight: 700;
            letter-spacing: -2px;
            text-transform: uppercase;
            line-height: 1;
            margin-bottom: 12px;
        }

        .page-intro {
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0.55;
            margin-bottom: 80px;
        }

        
        /* ==================== TEXT + LINKS ==================== */
        .about {
            max-width: 640px;
            font-size: 18px;
            line-height: 1.6;
        }

        .about p + p {
            margin-top: 1em;
        }

        .about .lead {
            font-size: 24px;
            line-height: 1.4;
        }

        .music-photo {
            display: block;
            width: 100%;
            max-width: 760px;
            height: auto;
            margin: 0 auto;
            background: var(--placeholder);
        }

        /* Track rows, ported from the Audiospatials artist pages (js/players.js there). */
        .tracks {
            max-width: 760px;
            margin: 48px auto 0;
        }

        .track {
            position: relative;
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            grid-template-rows: auto auto;
            align-items: center;
            column-gap: 18px;
            row-gap: 9px;
        }

        .track + .track {
            margin-top: 26px;
        }

        .track-play {
            grid-row: 1 / span 2;
            appearance: none;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            padding: 0;
            border: 0;
            background: var(--placeholder);
            color: var(--text-color);
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .track-play i {
            width: 11px;
            height: 13px;
            margin-left: 3px;
            background: currentColor;
            clip-path: polygon(0 0, 100% 50%, 0 100%);
        }

        .track[data-state="playing"] .track-play i {
            width: 4px;
            height: 12px;
            margin-left: 0;
            clip-path: none;
            box-shadow: 6px 0 0 currentColor;
            transform: translateX(-3px);
        }

        .track[data-state="loading"] .track-play i {
            opacity: 0.4;
        }

        .track-play:focus-visible {
            outline: 1px solid var(--text-color);
            outline-offset: 3px;
        }

        @media (hover: hover) {
            .track-play:hover {
                background: var(--rule-color);
            }
        }

        .track[data-state="playing"] .track-play {
            background: var(--text-color);
            color: var(--bg-color);
        }

        .track-name {
            grid-column: 2;
            align-self: end;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .track-title {
            font-size: 16px;
            letter-spacing: -0.005em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .track-sub,
        .track-time {
            font-size: 11px;
            letter-spacing: 1px;
        }

        .track-time {
            grid-column: 3;
            align-self: end;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
            opacity: 0.55;
        }

        .track-sub a {
            color: inherit;
            text-decoration: none;
            opacity: 0.55;
            transition: opacity 0.2s;
        }

        .track-sub a::after {
            content: "";
            display: inline-block;
            width: 0.5em;
            height: 0.5em;
            margin-left: 0.6em;
            vertical-align: 0.22em;
            background: currentColor;
            clip-path: polygon(0 0, 100% 0, 100% 100%);
        }

        .track-sub a:hover,
        .track-sub a:focus-visible {
            opacity: 1;
        }

        .track-bar {
            grid-column: 2 / -1;
            align-self: start;
            height: 12px;
            position: relative;
            cursor: pointer;
        }

        .track-bar::before,
        .track-bar span {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 5px;
            height: 2px;
            border-radius: 2px;
        }

        .track-bar::before {
            background: var(--rule-color);
        }

        .track-bar span {
            background: var(--text-color);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.25s linear;
        }

        .track[data-state="idle"] .track-bar {
            cursor: default;
        }

        /* The real SoundCloud player stays hidden unless the browser refuses to play it that way. */
        .track-frame {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
        }

        .track-frame iframe {
            display: block;
            width: 100%;
            border: 0;
        }

        .track.native .track-frame {
            position: static;
            grid-column: 1 / -1;
            width: 100%;
            height: auto;
            overflow: visible;
            opacity: 1;
            pointer-events: auto;
            margin: 4px 0 14px;
        }

        .track.native .track-frame iframe {
            height: 120px;
        }

        .track.native .track-bar {
            display: none;
        }

        /* Phones: the time drops under the bar so long titles get the full row. */
        @media (max-width: 600px) {
            .track-name {
                grid-column: 2 / -1;
            }

            .track-time {
                grid-column: 2 / -1;
                grid-row: 3;
                justify-self: end;
                margin-top: -6px;
            }
        }

        .links {
            list-style: none;
            border-bottom: 1px solid var(--rule-color);
            margin-top: 80px;
        }

        .page-intro + .links {
            margin-top: 0;
        }

        .links li {
            border-top: 1px solid var(--rule-color);
        }

        .links a {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 20px;
            padding: 18px 0;
            color: var(--text-color);
            text-decoration: none;
            font-size: clamp(24px, 4vw, 44px);
            font-weight: 700;
            letter-spacing: -1px;
            text-transform: uppercase;
            line-height: 1;
            transition: opacity 0.2s ease, padding-left 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .links a:hover {
            opacity: 0.5;
        }

        /* The same glide as the link rows on Audiospatials. */
        .links a:focus-visible {
            padding-left: 10px;
        }

        @media (hover: hover) {
            .links a:hover {
                padding-left: 10px;
            }
        }

        .links .out {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: currentColor;
            clip-path: polygon(0 0, 100% 0, 100% 100%);
        }

        .links.small {
            max-width: 760px;
            margin: 56px auto 0;
        }

        .links.small a {
            align-items: center;
            padding-top: 15px;
            padding-bottom: 15px;
            font-size: 15px;
            font-weight: 400;
            letter-spacing: -0.005em;
            text-transform: none;
        }

        .links.small .out {
            width: 7px;
            height: 7px;
        }

        footer {
            padding: 24px 40px;
            font-size: 12px;
            color: var(--text-color);
            text-align: center;
        }

        @media (max-width: 900px) {
            header {
                padding: 20px;
                align-items: center;
            }

            .logo {
                font-size: 12px;
            }

            .nav-links {
                gap: 16px;
            }

            .nav-links svg {
                width: 18px;
                height: 18px;
            }

            main {
                padding: 32px 20px 60px;
            }

            .page-title {
                font-size: 64px;
                letter-spacing: -1.5px;
            }

            .page-intro {
                margin-bottom: 56px;
            }

            .links {
                margin-top: 56px;
            }

            footer {
                padding: 20px;
                font-size: 11px;
            }
        }

        @media (max-width: 600px) {
            header {
                padding: 16px 20px;
                gap: 12px;
            }

            .logo {
                font-size: 11px;
            }

            .section-nav {
                order: 3;
                width: 100%;
                margin: 0;
                gap: 6px 16px;
                flex-wrap: wrap;
            }

            .page-title {
                font-size: min(48px, calc((100vw - 40px) / 7));
                letter-spacing: -1px;
            }

            .about {
                font-size: 16px;
            }

            .about .lead {
                font-size: 20px;
            }
        }

        .arrive {
            display: inline-block;
            white-space: pre;
        }

        .arrive-text {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
        }

        @view-transition {
            navigation: auto;
        }

        @media (prefers-reduced-motion: reduce) {
            ::view-transition-group(*),
            ::view-transition-old(*),
            ::view-transition-new(*) {
                animation: none !important;
            }
            * {
                transition: none !important;
            }
        }

        /* All lowercase, Gregor 2026-10-23. */
        *, *::before, *::after {
            text-transform: lowercase !important;
        }
    </style>

    <script>
        (function () {
            var root = document.documentElement;
            var btn = document.getElementById('themeToggle');
            var themeColor = document.querySelector('meta[name="theme-color"]');

            function sync() {
                btn.setAttribute('aria-pressed',
                    String(root.getAttribute('data-theme') === 'light'));
            }

            btn.addEventListener('click', function () {
                if (root.getAttribute('data-theme') === 'light') {
                    root.removeAttribute('data-theme');
                    themeColor.content = '#0a0a0a';
                    try { localStorage.setItem('theme', 'dark'); } catch (e) {}
                } else {
                    root.setAttribute('data-theme', 'light');
                    themeColor.content = '#fafaf8';
                    try { localStorage.setItem('theme', 'light'); } catch (e) {}
                }
                sync();
            });

            sync();
        })();
    </script>

    <script>
        // Track rows. Nothing from SoundCloud loads until a row is near the screen; the hidden
        // player is loaded early so one tap can start it (Safari won't play sound that starts later).
        (function () {
            var rows = [].slice.call(document.querySelectorAll('.track[data-src]'));
            if (!rows.length) return;

            var api = null;
            function soundcloud() {
                return api || (api = new Promise(function (ok, fail) {
                    var s = document.createElement('script');
                    s.src = 'https://w.soundcloud.com/player/api.js';
                    s.onload = function () { ok(window.SC); };
                    s.onerror = fail;
                    document.head.appendChild(s);
                }));
            }

            function clock(ms) {
                var t = Math.max(0, Math.round(ms / 1000));
                var h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, sec = String(t % 60).padStart(2, '0');
                return h ? h + ':' + String(m).padStart(2, '0') + ':' + sec : m + ':' + sec;
            }

            var all = rows.map(function (row) {
                var btn = row.querySelector('.track-play');
                var time = row.querySelector('.track-time');
                var fill = row.querySelector('.track-bar span');
                var bar = row.querySelector('.track-bar');
                var title = row.querySelector('.track-title').textContent;
                var w = null, prep = null, want = false, playing = false, started = false, duration = 0, watch = 0;

                function state(s) {
                    row.dataset.state = s;
                    btn.setAttribute('aria-label', (s === 'playing' ? 'Pause ' : 'Play ') + title);
                }
                function native() { row.classList.add('native'); state('idle'); }
                function progress(pos) {
                    if (duration) fill.style.transform = 'scaleX(' + Math.min(1, pos / duration) + ')';
                    time.textContent = duration ? clock(pos) + ' / ' + clock(duration) : '';
                }
                // If it hasn't started after a few seconds the browser blocked it, so show the real player.
                function start() {
                    w.play();
                    clearTimeout(watch);
                    watch = setTimeout(function () { if (!playing) native(); }, 3500);
                }

                function prepare() {
                    if (prep) return prep;
                    var slot = document.createElement('div');
                    slot.className = 'track-frame';
                    var frame = document.createElement('iframe');
                    frame.src = row.dataset.src;
                    frame.allow = 'autoplay; encrypted-media';
                    frame.title = title;
                    slot.appendChild(frame);
                    row.appendChild(slot);
                    prep = soundcloud().then(function (SC) {
                        var widget = SC.Widget(frame), E = SC.Widget.Events;
                        widget.bind(E.PLAY, function () {
                            clearTimeout(watch);
                            started = playing = true;
                            state('playing');
                            row.classList.remove('native');
                            widget.getDuration(function (d) { duration = d; });
                            all.forEach(function (t) { if (t.row !== row) t.pause(); });
                        });
                        widget.bind(E.PAUSE, function () { playing = false; if (started) state('paused'); });
                        widget.bind(E.FINISH, function () { playing = false; state('paused'); progress(0); });
                        widget.bind(E.PLAY_PROGRESS, function (p) { progress(p.currentPosition); });
                        widget.bind(E.READY, function () {
                            widget.getDuration(function (d) { duration = d; progress(0); });
                            w = widget;
                            if (want) start();
                        });
                    }).catch(native);
                    return prep;
                }

                btn.addEventListener('click', function () {
                    if (w) { if (playing) w.pause(); else start(); return; }
                    want = true;
                    state('loading');
                    prepare();
                });
                bar.addEventListener('click', function (e) {
                    if (!w || !duration) return;
                    var r = bar.getBoundingClientRect();
                    w.seekTo(((e.clientX - r.left) / r.width) * duration);
                    if (!playing) start();
                });

                state('idle');
                return { row: row, prepare: prepare, pause: function () { if (w && playing) w.pause(); } };
            });

            if ('IntersectionObserver' in window) {
                var near = new IntersectionObserver(function (entries) {
                    entries.forEach(function (e) {
                        if (!e.isIntersecting) return;
                        near.unobserve(e.target);
                        all.filter(function (t) { return t.row === e.target; })[0].prepare();
                    });
                }, { rootMargin: '300px' });
                rows.forEach(function (r) { near.observe(r); });
            } else all.forEach(function (t) { t.prepare(); });
        })();
    </script>

<script>document.querySelectorAll("[data-yr]").forEach(function(e){e.textContent=new Date().getFullYear()})</script>
</body>
