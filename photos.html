        (function () {
            try {
                if (localStorage.getItem('theme') === 'light') {
                    document.documentElement.setAttribute('data-theme', 'light');
                    document.querySelector('meta[name="theme-color"]').content = '#fafaf8';
                }
            } catch (e) {}
        })();

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #0a0a0a;
            --text-color: #f5f5f5;
        }

        [data-theme="light"] {
            --bg-color: #fafaf8;
            --text-color: #141414;
        }

        body {
            overflow-x: clip;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 
                Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 24px 40px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .theme-toggle {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            gap: 4px;
            color: inherit;
            transition: opacity 0.2s ease;
            line-height: 1;
            position: relative;
            top: 1px;
        }

        .theme-toggle:hover {
            opacity: 0.7;
        }

        .theme-toggle svg {
            width: 18px;
            height: 18px;
        }

        .theme-toggle .slash {
            font-size: 18px;
            font-weight: 300;
        }

        .logo {
            view-transition-name: site-logo;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .nav-links {
            view-transition-name: site-utils;
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-color);
            text-decoration: none;
            transition: opacity 0.2s ease;
            display: flex;
            align-items: center;
        }

        .nav-links a:hover {
            opacity: 0.5;
        }

        .nav-links svg {
            display: block;
        }

        .section-nav {
            display: flex;
            gap: 20px;
            margin: 2px auto 0 32px;
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .section-nav a {
            color: var(--text-color);
            text-decoration: none;
            opacity: 0.5;
            transition: opacity 0.2s ease;
        }

        .section-nav a:hover,
        .section-nav a[aria-current] {
            opacity: 1;
        }

        main {
            flex: 1;
            display: flex;
            padding: 60px 40px;
            gap: 60px;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .back-link {
            position: absolute;
            top: 62px;
            left: 40px;
            color: var(--text-color);
            text-decoration: none;
            font-size: 14px;
            opacity: 0.7;
            transition: opacity 0.2s ease;
        }

        .back-link:hover {
            opacity: 1;
        }

        .sections {
            position: relative;
            z-index: 6;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 80px;
        }

        /* Only as wide as its word, so empty space beside a short word isn't part of the link. */
        .section-item {
            align-self: flex-start;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }

        .section-title h2 {
            font-size: clamp(48px, 10vw, 120px);
            font-weight: 700;
            letter-spacing: -2px;
            text-transform: uppercase;
            line-height: 1;
        }

        .section-item:hover .section-title h2 {
            opacity: 0.6;
            transition: opacity 0.2s ease;
        }

        /* Hover preview: photos from the section float beside the cursor, under the words (mouse only). */
        .peek {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 5;
            width: clamp(240px, 26vw, 400px);
            aspect-ratio: 1;
            pointer-events: none;
            will-change: transform;
        }

        .peek-in {
            position: absolute;
            inset: 0;
            opacity: 0;
            transform: scale(0.94);
            transition: opacity 0.5s ease, transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .peek.on .peek-in {
            opacity: 1;
            transform: none;
            transition: opacity 0.7s ease, transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .peek img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 0.9s ease;
        }

        .peek img.on {
            opacity: 1;
        }

        @media (prefers-reduced-motion: reduce) {
            .peek-in {
                transform: none;
            }
        }

        footer {
            padding: 24px 40px;
            font-size: 12px;
            color: var(--text-color);
            text-align: center;
        }

        @media (max-width: 900px) {
            header {
                padding: 20px;
                align-items: center;
            }

            .logo {
                font-size: 12px;
            }

            .nav-links {
                gap: 16px;
            }

            .nav-links svg {
                width: 18px;
                height: 18px;
            }

            main {
                padding: 40px 20px;
            }

            .back-link {
                top: 42px;
                left: 20px;
            }

            .section-title h2 {
                font-size: 64px;
                letter-spacing: -1.5px;
            }

            .sections {
                gap: 60px;
                width: 100%;
            }

            footer {
                padding: 20px;
                font-size: 11px;
            }
        }

        @media (max-width: 600px) {
            header {
                padding: 16px 20px;
                gap: 12px;
            }

            .logo {
                font-size: 11px;
            }

            .section-nav {
                order: 3;
                width: 100%;
                margin: 0;
                gap: 6px 16px;
                flex-wrap: wrap;
            }

            .nav-links {
                gap: 12px;
            }

            .section-title h2 {
                font-size: 48px;
                letter-spacing: -1px;
            }

            .sections {
                gap: 50px;
            }
        }
        .arrive {
            display: inline-block;
            white-space: pre;
        }

        .arrive-text {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
        }

        @view-transition {
            navigation: auto;
        }

        @media (prefers-reduced-motion: reduce) {
            ::view-transition-group(*),
            ::view-transition-old(*),
            ::view-transition-new(*) {
                animation: none !important;
            }
        }

        /* All lowercase, Gregor 2026-10-23. */
        *, *::before, *::after {
            text-transform: lowercase !important;
        }
    </style>

    <script>
        (function () {
            if (!matchMedia('(hover: hover) and (pointer: fine)').matches) return;
            var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
            var items = [].slice.call(document.querySelectorAll('.section-item[data-peek]'));
            var peek = document.createElement('div');
            peek.className = 'peek';
            peek.setAttribute('aria-hidden', 'true');
            var inner = document.createElement('div');
            inner.className = 'peek-in';
            peek.appendChild(inner);
            document.body.appendChild(peek);

            var sets = new Map(), built = false;
            function build() {
                if (built) return;
                built = true;
                items.forEach(function (a) {
                    sets.set(a, a.dataset.peek.split('|').map(function (src) {
                        var img = new Image();
                        img.decoding = 'async';
                        img.alt = '';
                        img.src = src;
                        inner.appendChild(img);
                        return img;
                    }));
                });
            }
            // Loaded once the page is settled, so the first hover is instant and the gallery is warm.
            function warm() { if (!document.prerendering) (window.requestIdleCallback || setTimeout)(build, { timeout: 1500 }); }
            if (document.readyState === 'complete') warm(); else addEventListener('load', warm);
            document.addEventListener('prerenderingchange', warm);

            // `gone` is true only once the preview has fully faded out; until then it keeps gliding after
            // the cursor, so moving from one word to the next is a crossfade, not a hide and a jump.
            var x = 0, y = 0, tx = 0, ty = 0, raf = 0, cycle = 0, hideTimer = 0, goneTimer = 0;
            var set = null, at = 0, gone = true;
            function aim(e) {
                var w = peek.offsetWidth, gap = 28;
                tx = e.clientX + gap + w > innerWidth ? e.clientX - gap - w : e.clientX + gap;
                ty = Math.max(70, Math.min(innerHeight - w - 8, e.clientY - w / 2));
                if (gone || still) { x = tx; y = ty; }
                if (!raf) raf = requestAnimationFrame(tick);
            }
            function tick() {
                x += (tx - x) * 0.11;
                y += (ty - y) * 0.11;
                peek.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0)';
                raf = !gone && (Math.abs(tx - x) > 0.3 || Math.abs(ty - y) > 0.3) ? requestAnimationFrame(tick) : 0;
            }
            function show(i) {
                at = i;
                inner.querySelectorAll('img.on').forEach(function (m) { if (m !== set[i]) m.classList.remove('on'); });
                set[i].classList.add('on');
            }
            function enter(a, e) {
                clearTimeout(hideTimer);
                clearTimeout(goneTimer);
                build();
                if (set !== sets.get(a)) {
                    set = sets.get(a);
                    show(0);
                    clearInterval(cycle);
                    if (!still) cycle = setInterval(function () { show((at + 1) % set.length); }, 1700);
                }
                aim(e);
                gone = false;
                peek.classList.add('on');
            }
            function hide() {
                clearInterval(cycle);
                set = null;
                peek.classList.remove('on');
                goneTimer = setTimeout(function () { gone = true; }, 550);
            }
            function leave() {
                clearTimeout(hideTimer);
                hideTimer = setTimeout(hide, 260);
            }

            items.forEach(function (a) {
                a.addEventListener('mouseenter', function (e) { enter(a, e); });
                a.addEventListener('mouseleave', leave);
            });
            document.addEventListener('mousemove', function (e) { if (!gone) aim(e); });
            addEventListener('pagehide', function () { clearTimeout(hideTimer); hide(); gone = true; });
        })();
    </script>

    <script>
        (function () {
            var root = document.documentElement;
            var btn = document.getElementById('themeToggle');
            var themeColor = document.querySelector('meta[name="theme-color"]');

            function sync() {
                btn.setAttribute('aria-pressed',
                    String(root.getAttribute('data-theme') === 'light'));
            }

            btn.addEventListener('click', function () {
                if (root.getAttribute('data-theme') === 'light') {
                    root.removeAttribute('data-theme');
                    themeColor.content = '#0a0a0a';
                    try { localStorage.setItem('theme', 'dark'); } catch (e) {}
                } else {
                    root.setAttribute('data-theme', 'light');
                    themeColor.content = '#fafaf8';
                    try { localStorage.setItem('theme', 'light'); } catch (e) {}
                }
                sync();
            });

            sync();
        })();
    </script>
