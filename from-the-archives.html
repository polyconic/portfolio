    <script>
        // Must stay in <head>: moving it later reintroduces the theme flash.
        (function () {
            try {
                if (localStorage.getItem('theme') === 'light') {
                    document.documentElement.setAttribute('data-theme', 'light');
                    document.querySelector('meta[name="theme-color"]').content = '#fafaf8';
                }
            } catch (e) {}
        })();
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #0a0a0a;
            --text-color: #f5f5f5;
            --rule-color: rgba(245, 245, 245, 0.18);
            --placeholder: rgba(245, 245, 245, 0.07);
        }

        [data-theme="light"] {
            --bg-color: #fafaf8;
            --text-color: #141414;
            --rule-color: rgba(20, 20, 20, 0.16);
            --placeholder: rgba(20, 20, 20, 0.06);
        }

        body {
            overflow-x: clip;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
                Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ==================== HEADER ==================== */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 24px 40px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .theme-toggle {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            gap: 4px;
            color: inherit;
            transition: opacity 0.2s ease;
            line-height: 1;
            position: relative;
            top: 1px;
        }

        .theme-toggle:hover {
            opacity: 0.7;
        }

        .theme-toggle svg {
            width: 18px;
            height: 18px;
        }

        .theme-toggle .slash {
            font-size: 18px;
            font-weight: 300;
        }

        .logo {
            view-transition-name: site-logo;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            text-decoration: none;
            color: inherit;
        }

        .nav-links {
            view-transition-name: site-utils;
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-color);
            text-decoration: none;
            transition: opacity 0.2s ease;
            display: flex;
            align-items: center;
        }

        .nav-links a:hover {
            opacity: 0.5;
        }

        .nav-links svg {
            display: block;
        }

        .section-nav {
            display: flex;
            gap: 20px;
            margin: 2px auto 0 32px;
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .section-nav a {
            color: var(--text-color);
            text-decoration: none;
            opacity: 0.5;
            transition: opacity 0.2s ease;
        }

        .section-nav a:hover,
        .section-nav a[aria-current] {
            opacity: 1;
        }

        /* ==================== MAIN ==================== */
        main {
            flex: 1;
            padding: 40px 40px 60px;
        }

        .back-link {
            display: inline-block;
            color: var(--text-color);
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 20px;
            opacity: 0.7;
            transition: opacity 0.2s ease;
        }

        .back-link:hover {
            opacity: 1;
        }

        .book-header h1 {
            font-size: clamp(36px, 6vw, 64px);
            font-weight: 700;
            letter-spacing: -1px;
            text-transform: uppercase;
            line-height: 1.15;
        }

        .book-intro {
            margin-top: 10px;
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            opacity: 0.55;
        }

        /* ==================== BOOK ==================== */
        .book-frame {
            position: relative;
            width: 100%;
            max-width: max(520px, min(1500px, calc((100svh - 370px) * 2.375)));
            margin: 32px auto 0;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .book-frame.ready {
            opacity: 1;
        }

        .book {
            will-change: transform;
            transition: transform 0.7s cubic-bezier(0.65, 0, 0.35, 1);
        }

        .page {
            background: #100f0d;
            overflow: hidden;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        .book.zoomable .page {
            cursor: zoom-in;
        }

        .book.turning .page {
            cursor: none;
        }

        .turn-hint {
            position: absolute;
            left: -20px;
            top: -20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(10, 10, 10, 0.6);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 0;
            scale: 0.6;
            transition: opacity 0.18s ease, scale 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 50;
        }

        .turn-hint.show {
            opacity: 1;
            scale: 1;
        }

        .turn-hint svg {
            display: block;
            width: 8px;
            height: 18px;
        }

        .turn-hint.prev svg {
            transform: scaleX(-1);
        }

        .page img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            -webkit-user-drag: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .page img.loaded {
            opacity: 1;
        }

        .page.--soft::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .page.--soft.--left::after {
            background: linear-gradient(to left, rgba(0, 0, 0, 0.28), rgba(0, 0, 0, 0) 7%);
        }

        .page.--soft.--right::after {
            background: linear-gradient(to right, rgba(0, 0, 0, 0.28), rgba(0, 0, 0, 0) 7%);
        }

        [data-theme="light"] .page {
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
        }

        /* ==================== ZOOM ==================== */
        .zoom {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            overflow: hidden;
            touch-action: none;
        }

        .zoom.active {
            display: block;
        }

        .zoom img {
            position: absolute;
            left: 50%;
            top: 50%;
            max-width: calc(100% - 180px);
            max-height: calc(100% - 120px);
            transform: translate(-50%, -50%);
            cursor: zoom-in;
            user-select: none;
            -webkit-user-drag: none;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .zoom img.loaded {
            opacity: 1;
        }

        .zoom.zoomed img {
            max-width: none;
            max-height: none;
            transform: none;
            cursor: zoom-out;
        }

        .zoom-close,
        .zoom-prev,
        .zoom-next {
            position: fixed;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            transition: opacity 0.2s ease;
            z-index: 1001;
        }

        .zoom-close:hover,
        .zoom-prev:hover,
        .zoom-next:hover {
            opacity: 0.7;
        }

        .zoom-close {
            top: 20px;
            right: 20px;
            padding: 20px;
            font-size: 40px;
            line-height: 1;
        }

        .zoom-prev,
        .zoom-next {
            top: 50%;
            transform: translateY(-50%);
            padding: 12px;
        }

        .zoom-prev {
            left: 36px;
        }

        .zoom-next {
            right: 36px;
        }

        .zoom-prev svg,
        .zoom-next svg {
            display: block;
            width: 18px;
            height: 40px;
        }

        .zoom.zoomed .zoom-prev,
        .zoom.zoomed .zoom-next {
            display: none;
        }

        .zoom-count {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 24px;
            text-align: center;
            color: white;
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            opacity: 0.55;
            font-variant-numeric: tabular-nums;
            pointer-events: none;
        }

        .book-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 28px;
            margin-top: 22px;
        }

        .book-controls button {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            padding: 6px 10px;
            opacity: 0.7;
            transition: opacity 0.2s ease;
        }

        .book-controls button:hover {
            opacity: 1;
        }

        .book-controls button:disabled {
            opacity: 0.2;
            cursor: default;
        }

        .book-controls svg {
            display: block;
            width: 9px;
            height: 20px;
        }

        .book-count {
            min-width: 120px;
            text-align: center;
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            opacity: 0.55;
            font-variant-numeric: tabular-nums;
        }

        footer {
            padding: 24px 40px;
            font-size: 12px;
            color: var(--text-color);
            text-align: center;
        }

        @media (max-width: 900px) {
            header {
                padding: 20px;
                align-items: center;
            }

            .logo {
                font-size: 12px;
            }

            .nav-links {
                gap: 16px;
            }

            .nav-links svg {
                width: 18px;
                height: 18px;
            }

            main {
                padding: 32px 20px 48px;
            }

            footer {
                padding: 20px;
                font-size: 11px;
            }
        }

        @media (max-width: 900px) {
            .zoom img {
                max-width: calc(100% - 80px);
            }

            .zoom-prev {
                left: 12px;
                padding: 8px;
            }

            .zoom-next {
                right: 12px;
                padding: 8px;
            }

            .zoom-prev svg,
            .zoom-next svg {
                width: 12px;
                height: 28px;
            }
        }

        @media (max-width: 600px) {
            header {
                padding: 16px 20px;
                gap: 12px;
            }

            .logo {
                font-size: 11px;
            }

            .section-nav {
                order: 3;
                width: 100%;
                margin: 0;
                gap: 6px 16px;
                flex-wrap: wrap;
            }

            .book-header h1 {
                font-size: min(36px, calc((100vw - 40px) / 10.5));
            }

            .book-frame {
                margin-top: 28px;
            }
        }

        .arrive {
            display: inline-block;
            white-space: pre;
        }

        .arrive-text {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
        }

        @view-transition {
            navigation: auto;
        }

        @media (prefers-reduced-motion: reduce) {
            ::view-transition-group(*),
            ::view-transition-old(*),
            ::view-transition-new(*) {
                animation: none !important;
            }
            * {
                transition: none !important;
            }
        }

        /* All lowercase, Gregor 2026-10-23. */
        *, *::before, *::after {
            text-transform: lowercase !important;
        }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var dir = '/img/books/from-the-archives/';
            var interior = 74;
            var book = document.getElementById('book');
            var frame = document.getElementById('bookFrame');
            var count = document.getElementById('bookCount');
            var prev = document.getElementById('bookPrev');
            var next = document.getElementById('bookNext');

            // Cover, endpaper, the 74 pages, endpaper, back cover: page 1 is a right-hand page.
            var files = ['cover', null];
            for (var n = 1; n <= interior; n++) files.push('p' + String(n).padStart(3, '0'));
            files.push(null, 'back');
            var last = files.length - 1;

            var imgs = files.map(function (name, i) {
                var page = document.createElement('div');
                page.className = 'page';
                if (i === 0 || i === last) page.dataset.density = 'hard';
                if (!name) { book.appendChild(page); return null; }
                var img = document.createElement('img');
                img.alt = i === 0 ? 'Front cover of From the Archives: Analog Photography by Gregor Egan'
                    : i === last ? 'Back cover' : 'Page ' + (i - 1);
                img.width = 2560;
                img.height = 2156;
                img.decoding = 'async';
                img.draggable = false;
                img.dataset.src = dir + name + '.webp';
                img.addEventListener('load', function () { img.classList.add('loaded'); });
                page.appendChild(img);
                book.appendChild(page);
                return img;
            });

            function load(from, to) {
                for (var i = Math.max(0, from); i <= Math.min(last, to); i++) {
                    var img = imgs[i];
                    if (img && !img.src) img.src = img.dataset.src;
                }
            }

            // Pages are 684 x 576 (19:16), so a page width in steps of 19px keeps every page a whole number
            // of pixels. Fractional sizes let a hairline of the page underneath show along the bottom mid-turn.
            function snap() {
                frame.style.width = '';
                var w = frame.getBoundingClientRect().width;
                var step = w < 500 ? 19 : 38;
                frame.style.width = Math.floor(w / step) * step + 'px';
            }
            snap();
            window.addEventListener('resize', snap);

            var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            var pf = new St.PageFlip(book, {
                width: 684,
                height: 576,
                size: 'stretch',
                minWidth: 250,
                maxWidth: 2000,
                minHeight: 200,
                maxHeight: 2000,
                autoSize: true,
                showCover: true,
                usePortrait: true,
                mobileScrollSupport: true,
                maxShadowOpacity: 0.45,
                flippingTime: still ? 300 : 900,
                disableFlipByClick: true
            });

            // disableFlipByClick also blocks StPageFlip's own flipPrev on phones (its aim point there isn't a
            // corner), which would break the back arrow, back key and back swipe. Lift it for those calls.
            ['flipNext', 'flipPrev'].forEach(function (name) {
                var raw = pf[name].bind(pf);
                pf[name] = function (corner) {
                    pf.getSettings().disableFlipByClick = false;
                    raw(corner);
                    pf.getSettings().disableFlipByClick = true;
                };
            });

            function label(i) {
                if (i === 0) return 'Cover';
                if (i === last) return 'Back cover';
                var shown = pf.getOrientation() === 'portrait' ? [i] : [i, i + 1];
                var nums = shown.filter(function (k) { return k >= 2 && k <= interior + 1; })
                    .map(function (k) { return k - 1; });
                if (!nums.length) return i < 2 ? 'Inside cover' : 'End';
                return nums.join('–') + ' / ' + interior;
            }

            function update(i) {
                load(i - 2, i + 6);
                count.textContent = label(i);
                prev.disabled = i === 0;
                next.disabled = i >= last;
                var shift = pf.getOrientation() === 'landscape' ? (i === 0 ? '-25%' : i === last ? '25%' : '0') : '0';
                book.style.transform = shift === '0' ? '' : 'translateX(' + shift + ')';
            }

            load(0, 6);
            pf.loadFromHTML(book.querySelectorAll('.page'));
            update(0);

            // The boards jerk around when a corner follows the mouse, so only paper pages peel on hover.
            var boards = [0, 1, last - 1, last];
            book.addEventListener('mousemove', function (e) {
                var hit = target(e);
                pf.getSettings().showPageCorners = hit.paper;
                book.classList.toggle('zoomable', hit.paper && !hit.edge);
                hint(e, hit);
            });
            book.addEventListener('mouseleave', function () { hint(null); });

            pf.on('flip', function (e) { update(e.data); });
            pf.on('changeOrientation', function () { update(pf.getCurrentPageIndex()); });

            // Re-center while the page turns, not after: a closed book can only open.
            pf.on('changeState', function (e) {
                var i = pf.getCurrentPageIndex();
                if (e.data === 'flipping' && (i === 0 || i === last)) book.style.transform = '';
                else if (e.data === 'read') update(i);
            });

            function forward() {
                if (pf.getOrientation() === 'landscape' && pf.getCurrentPageIndex() === last - 2) {
                    book.style.transform = 'translateX(25%)';
                }
                pf.flipNext();
            }

            // Which page a point is over and what a click there does. The outer edge of each page (and its outer
            // corners, which StPageFlip turns on its own) turns the page; the rest of a paper page zooms. Covers
            // and blank endpapers turn wherever you click.
            function target(e) {
                var r = book.querySelector('.stf__block').getBoundingClientRect();
                var i = pf.getCurrentPageIndex();
                var wide = pf.getOrientation() === 'landscape';
                var left = e.clientX < r.left + r.width / 2;
                var under = wide && !left ? i + 1 : i;
                var pw = wide ? r.width / 2 : r.width;
                var x = e.clientX - r.left - (wide && !left ? pw : 0);
                var y = e.clientY - r.top;
                var band = Math.max(48, pw * 0.22);
                var c = Math.sqrt(pw * pw + r.height * r.height) / 5;
                var nearLeft = wide ? left && x < band : x < band;
                var nearRight = wide ? !left && x > pw - band : x > pw - band;
                var cornerX = wide ? (left ? x < c : x > pw - c) : (x < c || x > pw - c);
                var corner = cornerX && (y < c || y > r.height - c);
                var paper = under >= 2 && under <= interior + 1;
                var dir;
                if (paper) dir = wide ? (left ? -1 : 1) : (x < pw / 2 ? -1 : 1);
                else dir = under === last || (left && i !== 0) ? -1 : 1;
                return {
                    index: under,
                    paper: paper,
                    edge: !paper || nearLeft || nearRight || corner,
                    empty: wide && ((i === 0 && left) || (i === last && !left)),
                    dir: dir
                };
            }

            var hintEl = document.getElementById('turnHint');
            var hintTimer = 0;
            function hint(e, hit) {
                clearTimeout(hintTimer);
                if (!e || !hit || hit.empty || !hit.edge) {
                    hintEl.classList.remove('show');
                    book.classList.remove('turning');
                    return;
                }
                var f = frame.getBoundingClientRect();
                hintEl.style.translate = (e.clientX - f.left) + 'px ' + (e.clientY - f.top) + 'px';
                hintEl.classList.toggle('prev', hit.dir < 0);
                hintEl.classList.add('show');
                book.classList.add('turning');
            }

            var downX = 0, downY = 0, touch = false;
            book.addEventListener('pointerdown', function (e) {
                downX = e.clientX;
                downY = e.clientY;
                touch = e.pointerType !== 'mouse';
            });
            book.addEventListener('click', function (e) {
                if (Math.abs(e.clientX - downX) > 6 || Math.abs(e.clientY - downY) > 6) return;
                if (pf.getState() !== 'read' && pf.getState() !== 'fold_corner') return;
                var hit = target(e);
                if (hit.empty) return;
                if (!hit.edge) { openZoom(hit.index); return; }
                if (touch) {
                    hint(e, hit);
                    hintTimer = setTimeout(function () { hint(null); }, 450);
                }
                if (hit.dir < 0) pf.flipPrev();
                else forward();
            });

            prev.addEventListener('click', function () { pf.flipPrev(); });
            next.addEventListener('click', forward);
            document.addEventListener('keydown', function (e) {
                if (e.altKey || e.ctrlKey || e.metaKey || zoom.classList.contains('active')) return;
                if (e.key === 'ArrowRight') forward();
                else if (e.key === 'ArrowLeft') pf.flipPrev();
            });

            // Zoom view: one page at a time, fit to the screen; click it to go closer and move to look around.
            var zoom = document.getElementById('zoom');
            var zoomImg = document.getElementById('zoomImg');
            var zoomCount = document.getElementById('zoomCount');
            var zoomIndex = 2;
            var zoomToken = 0;
            var pan = { x: 0.5, y: 0.5 };

            function showZoom() {
                var token = ++zoomToken;
                setZoomed(false);
                zoomImg.classList.remove('loaded');
                zoomImg.src = imgs[zoomIndex].dataset.src;
                zoomImg.alt = imgs[zoomIndex].alt;
                zoomImg.decode().catch(function () {}).then(function () {
                    if (token === zoomToken) zoomImg.classList.add('loaded');
                });
                zoomCount.textContent = (zoomIndex - 1) + ' / ' + interior;
                if (zoomIndex < interior + 1) new Image().src = imgs[zoomIndex + 1].dataset.src;
                if (zoomIndex > 2) new Image().src = imgs[zoomIndex - 1].dataset.src;
            }

            function openZoom(i) {
                zoomIndex = i;
                showZoom();
                zoom.classList.add('active');
                document.body.style.overflow = 'hidden';
                zoom.querySelector('.zoom-close').focus({ preventScroll: true });
            }

            function closeZoom() {
                zoom.classList.remove('active');
                document.body.style.overflow = '';
                var i = pf.getCurrentPageIndex();
                if (zoomIndex !== i && !(pf.getOrientation() === 'landscape' && zoomIndex === i + 1)) {
                    pf.turnToPage(zoomIndex);
                    update(pf.getCurrentPageIndex());
                }
            }

            function stepZoom(dir) {
                var i = zoomIndex + dir;
                if (i < 2 || i > interior + 1) return;
                zoomIndex = i;
                showZoom();
            }

            function place() {
                var w = zoomImg.offsetWidth, h = zoomImg.offsetHeight;
                var vw = zoom.clientWidth, vh = zoom.clientHeight;
                zoomImg.style.left = (w > vw ? -pan.x * (w - vw) : (vw - w) / 2) + 'px';
                zoomImg.style.top = (h > vh ? -pan.y * (h - vh) : (vh - h) / 2) + 'px';
            }

            function setZoomed(on, e) {
                if (!on) {
                    zoom.classList.remove('zoomed');
                    zoomImg.style.width = zoomImg.style.left = zoomImg.style.top = '';
                    return;
                }
                var fit = zoomImg.getBoundingClientRect();
                pan.x = Math.min(1, Math.max(0, (e.clientX - fit.left) / fit.width));
                pan.y = Math.min(1, Math.max(0, (e.clientY - fit.top) / fit.height));
                zoom.classList.add('zoomed');
                zoomImg.style.width = Math.max(fit.width * 2, Math.min(zoom.clientWidth, 1600)) + 'px';
                place();
            }

            zoomImg.addEventListener('click', function (e) {
                if (moved) return;
                setZoomed(!zoom.classList.contains('zoomed'), e);
            });

            zoom.addEventListener('mousemove', function (e) {
                if (!zoom.classList.contains('zoomed')) return;
                pan.x = e.clientX / zoom.clientWidth;
                pan.y = e.clientY / zoom.clientHeight;
                place();
            });

            // Touch: drag to look around when zoomed, swipe to change page when not.
            var tx = 0, ty = 0, startPan = null, moved = false;
            zoom.addEventListener('touchstart', function (e) {
                tx = e.touches[0].clientX;
                ty = e.touches[0].clientY;
                startPan = { x: pan.x, y: pan.y };
                moved = false;
            }, { passive: true });
            zoom.addEventListener('touchmove', function (e) {
                var dx = e.touches[0].clientX - tx, dy = e.touches[0].clientY - ty;
                if (Math.abs(dx) > 6 || Math.abs(dy) > 6) moved = true;
                if (!zoom.classList.contains('zoomed')) return;
                var w = zoomImg.offsetWidth - zoom.clientWidth, h = zoomImg.offsetHeight - zoom.clientHeight;
                pan.x = Math.min(1, Math.max(0, startPan.x - (w > 0 ? dx / w : 0)));
                pan.y = Math.min(1, Math.max(0, startPan.y - (h > 0 ? dy / h : 0)));
                place();
            }, { passive: true });
            zoom.addEventListener('touchend', function (e) {
                var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
                if (!zoom.classList.contains('zoomed') && Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
                    stepZoom(dx < 0 ? 1 : -1);
                }
                setTimeout(function () { moved = false; }, 0);
            }, { passive: true });

            zoom.addEventListener('click', function (e) {
                if (e.target === zoom) closeZoom();
            });
            zoom.querySelector('.zoom-close').addEventListener('click', closeZoom);
            zoom.querySelector('.zoom-prev').addEventListener('click', function () { stepZoom(-1); });
            zoom.querySelector('.zoom-next').addEventListener('click', function () { stepZoom(1); });
            window.addEventListener('resize', function () {
                if (zoom.classList.contains('zoomed')) setZoomed(false);
            });
            document.addEventListener('keydown', function (e) {
                if (!zoom.classList.contains('active')) return;
                if (e.key === 'Escape') {
                    if (zoom.classList.contains('zoomed')) setZoomed(false);
                    else closeZoom();
                } else if (e.key === 'ArrowLeft') stepZoom(-1);
                else if (e.key === 'ArrowRight') stepZoom(1);
            });

            var cover = imgs[0];
            function show() { frame.classList.add('ready'); }
            if (cover.complete && cover.naturalWidth) show();
            else { cover.addEventListener('load', show); cover.addEventListener('error', show); }
        });
    </script>

        &copy; <span data-yr>2026</span> GREGOR EGAN
    </footer>

    <script>
        (function () {
            var root = document.documentElement;
            var btn = document.getElementById('themeToggle');
            var themeColor = document.querySelector('meta[name="theme-color"]');

            function sync() {
                btn.setAttribute('aria-pressed',
                    String(root.getAttribute('data-theme') === 'light'));
            }

            btn.addEventListener('click', function () {
                if (root.getAttribute('data-theme') === 'light') {
                    root.removeAttribute('data-theme');
                    themeColor.content = '#0a0a0a';
                    try { localStorage.setItem('theme', 'dark'); } catch (e) {}
                } else {
                    root.setAttribute('data-theme', 'light');
                    themeColor.content = '#fafaf8';
                    try { localStorage.setItem('theme', 'light'); } catch (e) {}
                }
                sync();
            });

            sync();
        })();
    </script>

<script>document.querySelectorAll("[data-yr]").forEach(function(e){e.textContent=new Date().getFullYear()})</script>
