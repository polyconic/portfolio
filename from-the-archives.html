<html lang="en">
<head>

    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    {"prerender": [{"where": {"href_matches": "/*"}, "eagerness": "moderate"}]}
    </script>

    <script>
        // Must stay in <head>: moving it later reintroduces the theme flash.
        (function () {
            try {
                if (localStorage.getItem('theme') === 'light') {
                    document.documentElement.setAttribute('data-theme', 'light');
                    document.querySelector('meta[name="theme-color"]').content = '#fafaf8';
                }
            } catch (e) {}
        })();
    </script>

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="gregor egan">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #0a0a0a;
            --text-color: #f5f5f5;
            --rule-color: rgba(245, 245, 245, 0.18);
            --placeholder: rgba(245, 245, 245, 0.07);
        }

        [data-theme="light"] {
            --bg-color: #fafaf8;
            --text-color: #141414;
            --rule-color: rgba(20, 20, 20, 0.16);
            --placeholder: rgba(20, 20, 20, 0.06);
        }

        body {
            overflow-x: clip;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
                Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ==================== HEADER ==================== */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 24px 40px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .theme-toggle {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            gap: 4px;
            color: inherit;
            transition: opacity 0.2s ease;
            line-height: 1;
            position: relative;
            top: 1px;
        }

        .theme-toggle:hover {
            opacity: 0.7;
        }

        .theme-toggle svg {
            width: 18px;
            height: 18px;
        }

        .theme-toggle .slash {
            font-size: 18px;
            font-weight: 300;
        }

        .logo {
            view-transition-name: site-logo;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            text-decoration: none;
            color: inherit;
        }

        .nav-links {
            view-transition-name: site-utils;
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-color);
            text-decoration: none;
            transition: opacity 0.2s ease;
            display: flex;
            align-items: center;
        }

        .nav-links a:hover {
            opacity: 0.5;
        }

        .nav-links svg {
            display: block;
        }

        .section-nav {
            display: flex;
            gap: 20px;
            margin: 2px auto 0 32px;
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .section-nav a {
            color: var(--text-color);
            text-decoration: none;
            opacity: 0.5;
            transition: opacity 0.2s ease;
        }

        .section-nav a:hover,
        .section-nav a[aria-current] {
            opacity: 1;
        }

        /* ==================== MAIN ==================== */
        main {
            flex: 1;
            padding: 40px 40px 60px;
        }

        .back-link {
            display: inline-block;
            color: var(--text-color);
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 20px;
            opacity: 0.7;
            transition: opacity 0.2s ease;
        }

        .back-link:hover {
            opacity: 1;
        }

        .book-header h1 {
            font-size: clamp(36px, 6vw, 64px);
            font-weight: 700;
            letter-spacing: -1px;
            text-transform: uppercase;
            line-height: 1.15;
        }

        .book-intro {
            margin-top: 10px;
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            opacity: 0.55;
        }

        /* ==================== BOOK ==================== */
        .book-frame {
            width: 100%;
            max-width: max(520px, min(1500px, calc((100svh - 370px) * 2.375)));
            margin: 32px auto 0;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .book-frame.ready {
            opacity: 1;
        }

        .book {
            transition: transform 0.7s cubic-bezier(0.65, 0, 0.35, 1);
        }

        .page {
            background: #100f0d;
            overflow: hidden;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        .page img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            -webkit-user-drag: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .page img.loaded {
            opacity: 1;
        }

        .page.--soft::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .page.--soft.--left::after {
            background: linear-gradient(to left, rgba(0, 0, 0, 0.28), rgba(0, 0, 0, 0) 7%);
        }

        .page.--soft.--right::after {
            background: linear-gradient(to right, rgba(0, 0, 0, 0.28), rgba(0, 0, 0, 0) 7%);
        }

        [data-theme="light"] .page {
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
        }

        .book-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 28px;
            margin-top: 22px;
        }

        .book-controls button {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            padding: 6px 10px;
            opacity: 0.7;
            transition: opacity 0.2s ease;
        }

        .book-controls button:hover {
            opacity: 1;
        }

        .book-controls button:disabled {
            opacity: 0.2;
            cursor: default;
        }

        .book-controls svg {
            display: block;
            width: 9px;
            height: 20px;
        }

        .book-count {
            min-width: 120px;
            text-align: center;
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            opacity: 0.55;
            font-variant-numeric: tabular-nums;
        }

        footer {
            padding: 24px 40px;
            font-size: 12px;
            color: var(--text-color);
            text-align: center;
        }

        @media (max-width: 900px) {
            header {
                padding: 20px;
                align-items: center;
            }

            .logo {
                font-size: 12px;
            }

            .nav-links {
                gap: 16px;
            }

            .nav-links svg {
                width: 18px;
                height: 18px;
            }

            main {
                padding: 32px 20px 48px;
            }

            footer {
                padding: 20px;
                font-size: 11px;
            }
        }

        @media (max-width: 600px) {
            header {
                padding: 16px 20px;
                gap: 12px;
            }

            .logo {
                font-size: 11px;
            }

            .section-nav {
                order: 3;
                width: 100%;
                margin: 0;
                gap: 6px 16px;
                flex-wrap: wrap;
            }

            .book-header h1 {
                font-size: min(36px, calc((100vw - 40px) / 10.5));
            }

            .book-frame {
                margin-top: 28px;
            }
        }

        .arrive {
            display: inline-block;
            white-space: pre;
        }

        .arrive-text {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
        }

        @view-transition {
            navigation: auto;
        }

        @media (prefers-reduced-motion: reduce) {
            ::view-transition-group(*),
            ::view-transition-old(*),
            ::view-transition-new(*) {
                animation: none !important;
            }
            * {
                transition: none !important;
            }
        }
    </style>
</head>
<body>

        <a href="/" class="logo">Gregor Egan</a>

                <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">

                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>

    <main>
        <div class="book-header">
            <a href="/book-design" class="back-link">← Back to Book Design</a>
            <h1 data-arrive>From the Archives</h1>
            <script src="/arrive.js"></script>
            <p class="book-intro">Analog photography, 2020–2025</p>
        </div>

        <div class="book-frame" id="bookFrame">
            <div class="book" id="book"></div>
            <noscript><img src="/img/books/from-the-archives/cover.webp" alt="Front cover of From the Archives: Analog Photography by Gregor Egan" width="2560" height="2156" style="display:block;width:100%;max-width:700px;height:auto;margin:0 auto"></noscript>
        </div>

        <div class="book-controls">
            <button id="bookPrev" type="button" aria-label="Previous page"><svg viewBox="0 0 18 40" aria-hidden="true"><polyline points="16,2 2,20 16,38" fill="none" stroke="currentColor" stroke-width="1" vector-effect="non-scaling-stroke"/></svg></button>
            <span class="book-count" id="bookCount" aria-live="polite">Cover</span>
            <button id="bookNext" type="button" aria-label="Next page"><svg viewBox="0 0 18 40" aria-hidden="true"><polyline points="2,2 16,20 2,38" fill="none" stroke="currentColor" stroke-width="1" vector-effect="non-scaling-stroke"/></svg></button>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var dir = '/img/books/from-the-archives/';
            var interior = 74;
            var book = document.getElementById('book');
            var frame = document.getElementById('bookFrame');
            var count = document.getElementById('bookCount');
            var prev = document.getElementById('bookPrev');
            var next = document.getElementById('bookNext');

            // Cover, endpaper, the 74 pages, endpaper, back cover: page 1 is a right-hand page.
            var files = ['cover', null];
            for (var n = 1; n <= interior; n++) files.push('p' + String(n).padStart(3, '0'));
            files.push(null, 'back');
            var last = files.length - 1;

            var imgs = files.map(function (name, i) {
                var page = document.createElement('div');
                page.className = 'page';
                if (i === 0 || i === last) page.dataset.density = 'hard';
                if (!name) { book.appendChild(page); return null; }
                var img = document.createElement('img');
                img.alt = i === 0 ? 'Front cover of From the Archives: Analog Photography by Gregor Egan'
                    : i === last ? 'Back cover' : 'Page ' + (i - 1);
                img.width = 2560;
                img.height = 2156;
                img.decoding = 'async';
                img.draggable = false;
                img.dataset.src = dir + name + '.webp';
                img.addEventListener('load', function () { img.classList.add('loaded'); });
                page.appendChild(img);
                book.appendChild(page);
                return img;
            });

            function load(from, to) {
                for (var i = Math.max(0, from); i <= Math.min(last, to); i++) {
                    var img = imgs[i];
                    if (img && !img.src) img.src = img.dataset.src;
                }
            }

            var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            var pf = new St.PageFlip(book, {
                width: 684,
                height: 576,
                size: 'stretch',
                minWidth: 250,
                maxWidth: 2000,
                minHeight: 200,
                maxHeight: 2000,
                autoSize: true,
                showCover: true,
                usePortrait: true,
                mobileScrollSupport: true,
                maxShadowOpacity: 0.45,
                flippingTime: still ? 300 : 900
            });

            function label(i) {
                if (i === 0) return 'Cover';
                if (i === last) return 'Back cover';
                var shown = pf.getOrientation() === 'portrait' ? [i] : [i, i + 1];
                var nums = shown.filter(function (k) { return k >= 2 && k <= interior + 1; })
                    .map(function (k) { return k - 1; });
                if (!nums.length) return i < 2 ? 'Inside cover' : 'End';
                return nums.join('–') + ' / ' + interior;
            }

            function update(i) {
                load(i - 2, i + 6);
                count.textContent = label(i);
                prev.disabled = i === 0;
                next.disabled = i >= last;
                var shift = pf.getOrientation() === 'landscape' ? (i === 0 ? '-25%' : i === last ? '25%' : '0') : '0';
                book.style.transform = shift === '0' ? '' : 'translateX(' + shift + ')';
            }

            load(0, 6);
            pf.loadFromHTML(book.querySelectorAll('.page'));
            update(0);

            pf.on('flip', function (e) { update(e.data); });
            pf.on('changeOrientation', function () { update(pf.getCurrentPageIndex()); });

            // Re-center while the page turns, not after: a closed book can only open.
            pf.on('changeState', function (e) {
                var i = pf.getCurrentPageIndex();
                if (e.data === 'flipping' && (i === 0 || i === last)) book.style.transform = '';
                else if (e.data === 'read') update(i);
            });

            function forward() {
                if (pf.getOrientation() === 'landscape' && pf.getCurrentPageIndex() === last - 2) {
                    book.style.transform = 'translateX(25%)';
                }
                pf.flipNext();
            }

            prev.addEventListener('click', function () { pf.flipPrev(); });
            next.addEventListener('click', forward);
            document.addEventListener('keydown', function (e) {
                if (e.altKey || e.ctrlKey || e.metaKey) return;
                if (e.key === 'ArrowRight') forward();
                else if (e.key === 'ArrowLeft') pf.flipPrev();
            });

            var cover = imgs[0];
            function show() { frame.classList.add('ready'); }
            if (cover.complete && cover.naturalWidth) show();
            else { cover.addEventListener('load', show); cover.addEventListener('error', show); }
        });
    </script>

    <footer>
        &copy; <span data-yr>2026</span> GREGOR EGAN
    </footer>

    <script>
        (function () {
            var root = document.documentElement;
            var btn = document.getElementById('themeToggle');
            var themeColor = document.querySelector('meta[name="theme-color"]');

            function sync() {
                btn.setAttribute('aria-pressed',
                    String(root.getAttribute('data-theme') === 'light'));
            }

            btn.addEventListener('click', function () {
                if (root.getAttribute('data-theme') === 'light') {
                    root.removeAttribute('data-theme');
                    themeColor.content = '#0a0a0a';
                    try { localStorage.setItem('theme', 'dark'); } catch (e) {}
                } else {
                    root.setAttribute('data-theme', 'light');
                    themeColor.content = '#fafaf8';
                    try { localStorage.setItem('theme', 'light'); } catch (e) {}
                }
                sync();
            });

            sync();
        })();
    </script>

<script>document.querySelectorAll("[data-yr]").forEach(function(e){e.textContent=new Date().getFullYear()})</script>
</body>
